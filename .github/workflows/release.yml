name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    if: github.repository == 'braebo/gooey'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create release (changesets/action).
      pull-requests: write # To create release pull request (changesets/action).
      id-token: write # Required for JSR.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so Changesets can generate changelogs with the correct commits.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run check

      - name: Release or Create Release Pull Request or Do Nothing
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run sync-version
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN, and its
          # presence makes changesets/action skip writing its own NPM_TOKEN one.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to JSR
        if: steps.changesets.outputs.published == 'true'
        run: bunx jsr publish --allow-dirty --allow-slow-types
