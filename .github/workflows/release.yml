name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    if: github.repository == 'braebo/gooey'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create release (changesets/action).
      pull-requests: write # To create release pull request (changesets/action).
      id-token: write # OIDC — npm trusted publishing and JSR both mint their token from it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all history so Changesets can generate changelogs with the correct commits.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url: it writes an .npmrc that reads a placeholder NODE_AUTH_TOKEN,
          # which shadows the OIDC exchange.

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run check

      # changesets/action writes ~/.npmrc with `_authToken=$NPM_TOKEN` when none exists —
      # "undefined" as a token would shadow the OIDC exchange. An existing file makes it skip.
      - name: npmrc for trusted publishing
        run: echo "provenance=true" > ~/.npmrc

      - name: Release or Create Release Pull Request or Do Nothing
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run sync-version
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: the package's trusted publisher on npmjs.com is this repo + this
          # workflow file, and npm exchanges the job's OIDC token for a publish credential.
          # Every token-based run since 0.4.0 died with E404 on PUT — a dead secret.

      - name: Publish to JSR
        if: steps.changesets.outputs.published == 'true'
        run: bunx jsr publish --allow-dirty --allow-slow-types
